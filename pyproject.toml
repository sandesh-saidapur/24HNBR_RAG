[project]
name = "trackside-24"
version = "0.2.0"
description = "Multimodal spatio-temporal race companion for the 2026 24h Nürburgring."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pyyaml>=6",
    "pillow>=10",
    "pillow-heif>=0.16",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
vector = ["lancedb>=0.41", "pyarrow>=15", "pillow-heif>=0.16", "transformers>=4.41", "torch>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.api", "src.indexing", "src.rag"]

[tool.ruff.lint.per-file-ignores]
# Curated, hand-written summaries are long prose; line length is not useful there.
"scripts/build_dashboard_assets.py" = ["E501"]
